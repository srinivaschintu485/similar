<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="1080" viewBox="0 0 1920 1080"
     role="img" aria-labelledby="title description">

  <title id="title">PdaSearch — Hybrid Retrieval and Ranking Architecture</title>
  <desc id="description">
    A single-slide architecture diagram showing data loading, query preparation,
    semantic and lexical similarity engines, sequential and union ranking,
    and enriched search results. The current implementation uses an embedding
    model but does not include a separate learned reranker. A cross-encoder
    reranker is shown separately as an optional enhancement.
  </desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="7"
                    flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>

    <marker id="runtimeArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748B"/>
    </marker>

    <marker id="dataArrow" markerWidth="7" markerHeight="7"
            refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#7094A4"/>
    </marker>

    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .title {
        font-size: 43px;
        font-weight: 750;
        fill: #14263D;
      }
      .subtitle {
        font-size: 23px;
        fill: #617185;
      }
      .section {
        font-size: 17px;
        font-weight: 750;
        letter-spacing: 1.2px;
        fill: #526579;
      }
      .heading {
        font-size: 22px;
        font-weight: 700;
        fill: #172B43;
      }
      .body {
        font-size: 20px;
        fill: #34465C;
      }
      .small {
        font-size: 18px;
        fill: #617185;
      }
      .code {
        font-family: Consolas, "Courier New", monospace;
        font-size: 18px;
        fill: #34465C;
      }
      .tag {
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 0.8px;
      }
      .runtime {
        fill: none;
        stroke: #64748B;
        stroke-width: 2.5;
        marker-end: url(#runtimeArrow);
      }
      .runtimeLine {
        fill: none;
        stroke: #64748B;
        stroke-width: 2.5;
      }
      .data {
        fill: none;
        stroke: #7094A4;
        stroke-width: 2;
        stroke-dasharray: 5 5;
        marker-end: url(#dataArrow);
      }
      .dataLine {
        fill: none;
        stroke: #7094A4;
        stroke-width: 2;
        stroke-dasharray: 5 5;
      }
      .railLabel {
        font-size: 16px;
        fill: #587E8E;
      }
    </style>
  </defs>

  <!-- =========================================================
       CANVAS AND TITLE
       ========================================================= -->

  <rect width="1920" height="1080" fill="#F5F7FB"/>
  <rect x="0" y="0" width="1920" height="8" fill="#213F63"/>

  <text x="48" y="76" class="title">
    PdaSearch — Hybrid Retrieval &amp; Ranking
  </text>

  <text x="48" y="118" class="subtitle">
    End-to-end flow from source data to relevant, UI-ready attribute matches
  </text>

  <rect x="48" y="149" width="1824" height="54" rx="10"
        fill="#EEEAF8" stroke="#DED5EF"/>

  <rect x="65" y="163" width="225" height="26" rx="5" fill="#DDD3F1"/>

  <text x="177.5" y="181" text-anchor="middle"
        class="tag" fill="#62428C">
    CURRENT IMPLEMENTATION
  </text>

  <text x="311" y="183" font-size="22" fill="#473660">
    ML powers semantic embeddings. Reranking uses similarity scores—not a separate learned reranker.
  </text>

  <!-- =========================================================
       SECTION LABELS
       ========================================================= -->

  <text x="48" y="240" class="section">01 / LOAD &amp; PREPARE</text>
  <text x="400" y="240" class="section">02 / BUILD QUERY</text>
  <text x="702" y="240" class="section">03 / SCORE DOCUMENTS</text>
  <text x="1144" y="240" class="section">04 / RANK CANDIDATES</text>
  <text x="1556" y="240" class="section">05 / RETURN RESULTS</text>

  <!-- Document-vector dependency -->
  <path d="M208 280 V265 H907 V280" class="data"/>
  <rect x="454" y="249" width="243" height="22" fill="#F5F7FB"/>
  <text x="575.5" y="265" text-anchor="middle" class="railLabel">
    Pre-computed document vectors
  </text>

  <!-- =========================================================
       COLUMN 1: SOURCE DATA AND SHARED STATE
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="48" y="280" width="320" height="534" rx="14"
          fill="#FFFFFF" stroke="#D6DFEA"/>
    <rect x="48" y="294" width="4" height="35" rx="2" fill="#53768E"/>

    <text x="68" y="316" class="heading">Load configured dataset</text>
    <text x="68" y="342" class="code">PdaSearch → _load()</text>

    <text x="68" y="380" class="tag" fill="#436C88">ORACLE SOURCE</text>
    <text x="68" y="407" class="code">_load_oracle() · oracle_pda</text>
    <text x="68" y="433" class="code">CDE_PDA_MAPPING</text>

    <line x1="68" y1="449" x2="348" y2="449" stroke="#E3E9F1"/>

    <text x="68" y="476" class="tag" fill="#436C88">FILE SOURCE</text>
    <text x="68" y="503" class="small">mat.npy + meta.json + CSV</text>
    <text x="68" y="531" class="small">Cache absent / stale? Build from</text>
    <text x="68" y="556" class="small">emb.json; L2-normalize vectors.</text>

    <rect x="65" y="578" width="286" height="173" rx="9"
          fill="#F1F5F9"/>

    <text x="81" y="604" class="tag" fill="#526579">SHARED IN-MEMORY STATE</text>

    <text x="81" y="634" class="code">self.matrix</text>
    <text x="81" y="657" class="small">N × D · float32 · normalized</text>

    <text x="81" y="686" class="code">self.meta</text>
    <text x="81" y="709" class="small">IDs + for_embeddings + fields</text>

    <text x="81" y="738" class="code">self.rows + header</text>

    <text x="68" y="781" class="small">Full records indexed by row_index</text>
  </g>

  <!-- =========================================================
       COLUMN 2: QUERY PREPARATION
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="400" y="280" width="270" height="534" rx="14"
          fill="#FFFFFF" stroke="#D6DFEA"/>
    <rect x="400" y="294" width="4" height="35" rx="2" fill="#3479BC"/>

    <text x="418" y="316" class="heading">One structured query</text>

    <rect x="418" y="345" width="234" height="117" rx="9"
          fill="#EDF4FC" stroke="#D9E7F6"/>

    <text x="434" y="372" class="tag" fill="#28639B">USER INPUTS</text>
    <text x="434" y="404" class="body">name · description</text>
    <text x="434" y="435" class="body">flow · table · path</text>

    <path d="M535 473 V489" class="runtime"/>

    <text x="418" y="517" class="code">_combine_query()</text>
    <text x="418" y="549" class="small">Align with indexed</text>
    <text x="418" y="575" class="code">for_embeddings text</text>

    <line x1="418" y1="596" x2="652" y2="596" stroke="#E3E9F1"/>

    <text x="418" y="629" class="code">search()</text>
    <text x="418" y="659" class="small">pipeline_order</text>
    <text x="418" y="687" class="small">pipeline_mode · top_n</text>

    <rect x="418" y="716" width="234" height="77" rx="9" fill="#F3F6FA"/>
    <text x="434" y="745" class="code">_block_sims()</text>
    <text x="434" y="773" class="small">Dispatch configured blocks</text>
  </g>

  <!-- =========================================================
       COLUMN 3A: SEMANTIC ENGINE
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="702" y="280" width="410" height="246" rx="14"
          fill="#FFFFFF" stroke="#CEC0E7"/>
    <rect x="702" y="294" width="4" height="35" rx="2" fill="#8557B7"/>

    <text x="722" y="316" class="heading">Semantic similarity</text>

    <rect x="1008" y="297" width="85" height="25" rx="5" fill="#EEE6F8"/>
    <text x="1050.5" y="315" text-anchor="middle"
          class="tag" fill="#7445A5">ML MODEL</text>

    <line x1="722" y1="336" x2="1092" y2="336" stroke="#E9E2F1"/>

    <text x="722" y="365" class="code">_embedding_sims()</text>

    <rect x="720" y="380" width="374" height="43" rx="7" fill="#F4EFFA"/>
    <text x="734" y="407" class="code">llm_agent.embed_texts(query)</text>

    <text x="722" y="453" class="small">
      L2-normalize query → matrix dot product
    </text>

    <text x="722" y="491" font-size="20" font-weight="650" fill="#6D4498">
      Output: cosine score per document
    </text>
  </g>

  <!-- =========================================================
       COLUMN 3B: LEXICAL ENGINE
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="702" y="548" width="410" height="266" rx="14"
          fill="#FFFFFF" stroke="#BEDFD3"/>
    <rect x="702" y="562" width="4" height="35" rx="2" fill="#329577"/>

    <text x="722" y="584" class="heading">Lexical similarity</text>

    <rect x="979" y="565" width="114" height="25" rx="5" fill="#E6F5ED"/>
    <text x="1036" y="583" text-anchor="middle"
          class="tag" fill="#23755B">TFIDF / FUZZY</text>

    <line x1="722" y1="603" x2="1092" y2="603" stroke="#DFEEE6"/>

    <text x="722" y="631" class="code">_fuzzy_sims() → _ensure_lexical()</text>
    <text x="722" y="660" class="small">Build once when needed; reuse afterward.</text>

    <rect x="722" y="680" width="177" height="64" rx="8" fill="#F0F8F4"/>
    <text x="735" y="704" font-size="18" font-weight="650" fill="#27785F">
      Character 3–5 grams
    </text>
    <text x="735" y="729" class="small">TF-IDF + cosine</text>

    <rect x="913" y="680" width="179" height="64" rx="8" fill="#F0F8F4"/>
    <text x="927" y="704" font-size="18" font-weight="650" fill="#27785F">
      Word 1–2 grams
    </text>
    <text x="927" y="729" class="small">TF-IDF + cosine</text>

    <text x="722" y="783" font-size="19" font-weight="650" fill="#27785F">
      Output: (character score + word score) / 2
    </text>
  </g>

  <!-- =========================================================
       QUERY DISPATCH AND SCORE HANDOFF
       Branches show dispatch, not necessarily parallel execution.
       ========================================================= -->

  <path d="M670 543 H686" class="runtimeLine"/>
  <circle cx="686" cy="543" r="4" fill="#64748B"/>

  <path d="M686 543 V403 H700" class="runtime"/>
  <path d="M686 543 V681 H700" class="runtime"/>

  <path d="M1112 403 H1128 V543" class="runtimeLine"/>
  <path d="M1112 681 H1128 V543" class="runtimeLine"/>
  <circle cx="1128" cy="543" r="4" fill="#64748B"/>
  <path d="M1128 543 H1142" class="runtime"/>

  <!-- =========================================================
       COLUMN 4: ACTUAL RANKING
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="1144" y="280" width="380" height="534" rx="14"
          fill="#FFFFFF" stroke="#E1C6AA" stroke-width="1.5"/>
    <rect x="1144" y="294" width="4" height="35" rx="2" fill="#CA8339"/>

    <text x="1162" y="316" font-size="22" font-weight="700" fill="#172B43">
      Candidate selection &amp; ranking
    </text>

    <text x="1162" y="345" class="code">Orchestrated by search()</text>

    <rect x="1162" y="365" width="344" height="166" rx="9"
          fill="#FFF6EB" stroke="#F0D7B9"/>

    <text x="1178" y="393" class="tag" fill="#A66322">SEQUENTIAL MODE</text>
    <text x="1178" y="425" font-size="19" fill="#594A3B">
      First block → wide candidate pool
    </text>
    <text x="1178" y="454" font-size="19" fill="#594A3B">
      Later blocks → rerank that pool
    </text>

    <line x1="1178" y1="470" x2="1490" y2="470" stroke="#EDD5B9"/>

    <text x="1178" y="496" font-size="18" font-weight="700" fill="#9B5B20">
      embedding → tfidf: TF-IDF reranks
    </text>
    <text x="1178" y="518" font-size="16" fill="#8A7157">
      Only candidates from the first pool remain.
    </text>

    <rect x="1162" y="550" width="344" height="163" rx="9"
          fill="#F5F7FA" stroke="#E0E6EE"/>

    <text x="1178" y="578" class="tag" fill="#526579">UNION MODE</text>
    <text x="1178" y="610" font-size="19" fill="#34465C">
      Each block → its own wide pool
    </text>
    <text x="1178" y="640" font-size="19" fill="#34465C">
      Merge candidates; average scores
    </text>
    <text x="1178" y="670" font-size="19" fill="#34465C">
      Sort the merged candidate set
    </text>
    <text x="1178" y="695" font-size="16" fill="#617185">
      Combines coverage from the retrieval blocks.
    </text>

    <path d="M1334 720 V739" class="runtime"/>

    <rect x="1162" y="748" width="344" height="45" rx="8" fill="#213F63"/>
    <text x="1334" y="778" text-anchor="middle"
          font-size="21" font-weight="700" fill="#FFFFFF">
      Select final top_n
    </text>
  </g>

  <!-- Ranking to output -->
  <path d="M1524 543 H1554" class="runtime"/>

  <!-- =========================================================
       COLUMN 5: ENRICHMENT AND OUTPUT
       ========================================================= -->

  <g filter="url(#shadow)">
    <rect x="1556" y="280" width="316" height="534" rx="14"
          fill="#FFFFFF" stroke="#D6DFEA"/>
    <rect x="1556" y="294" width="4" height="35" rx="2" fill="#3479BC"/>

    <text x="1575" y="316" class="heading">Enrich &amp; standardize</text>

    <circle cx="1589" cy="362" r="13" fill="#E8F0F9"/>
    <text x="1589" y="368" text-anchor="middle"
          font-size="17" font-weight="700" fill="#32628E">1</text>
    <text x="1612" y="369" font-size="19" font-weight="650" fill="#34465C">
      Resolve matched metadata
    </text>

    <text x="1576" y="403" class="code">self.meta → row_index</text>

    <line x1="1576" y1="423" x2="1852" y2="423" stroke="#E3E9F1"/>

    <circle cx="1589" cy="456" r="13" fill="#E8F0F9"/>
    <text x="1589" y="462" text-anchor="middle"
          font-size="17" font-weight="700" fill="#32628E">2</text>
    <text x="1612" y="463" font-size="19" font-weight="650" fill="#34465C">
      Retrieve complete record
    </text>

    <text x="1576" y="497" class="code">self.rows[row_index]</text>

    <line x1="1576" y1="518" x2="1852" y2="518" stroke="#E3E9F1"/>

    <circle cx="1589" cy="551" r="13" fill="#E8F0F9"/>
    <text x="1589" y="557" text-anchor="middle"
          font-size="17" font-weight="700" fill="#32628E">3</text>
    <text x="1612" y="558" font-size="19" font-weight="650" fill="#34465C">
      Format for display
    </text>

    <text x="1576" y="592" class="small">rank · similarity × 100</text>
    <text x="1576" y="623" class="code">_normalized_view()</text>

    <rect x="1575" y="653" width="278" height="140" rx="10"
          fill="#EDF4FC" stroke="#D7E5F4"/>

    <text x="1592" y="686" class="tag" fill="#32628E">RETURN TO CALLER / UI</text>
    <text x="1592" y="720" font-size="22" font-weight="700" fill="#213F63">
      SearchResult list
    </text>
    <text x="1592" y="749" class="body">+ processed query</text>
    <text x="1592" y="777" class="small">Consistent display schema</text>
  </g>

  <!-- =========================================================
       SHARED DATA DEPENDENCIES
       ========================================================= -->

  <path d="M208 814 V850 H1714 V814" class="data"/>
  <path d="M907 850 V814" class="data"/>

  <rect x="449" y="834" width="383" height="23" fill="#F5F7FB"/>
  <text x="640.5" y="851" text-anchor="middle" class="railLabel">
    for_embeddings corpus → lazy lexical indexes
  </text>

  <rect x="1179" y="834" width="408" height="23" fill="#F5F7FB"/>
  <text x="1383" y="851" text-anchor="middle" class="railLabel">
    Metadata + full source records → result enrichment
  </text>

  <!-- =========================================================
       OPTIONAL EXTENSION — CLEARLY NOT CURRENT IMPLEMENTATION
       ========================================================= -->

  <rect x="48" y="893" width="1824" height="119" rx="12"
        fill="#F2EFF8" stroke="#B9A5D5" stroke-dasharray="7 5"/>

  <text x="68" y="925" font-size="16" font-weight="750"
        letter-spacing="0.5px" fill="#704D9A">
    OPTIONAL: LEARNED ML RERANKER
  </text>

  <text x="68" y="954" font-size="19" fill="#5D4C73">
    Proposed extension—not currently present.
  </text>

  <text x="68" y="982" font-size="18" fill="#756584">
    Insert before final top_n selection.
  </text>

  <rect x="521" y="920" width="254" height="64" rx="8"
        fill="#FFFFFF" stroke="#D5CBE3"/>
  <text x="648" y="947" text-anchor="middle"
        font-size="20" font-weight="650" fill="#4C3B61">
    Wide candidate pool
  </text>
  <text x="648" y="971" text-anchor="middle" font-size="17" fill="#756584">
    From existing retrieval
  </text>

  <path d="M779 952 H811" class="runtime"/>

  <rect x="819" y="920" width="282" height="64" rx="8"
        fill="#FFFFFF" stroke="#D5CBE3"/>
  <text x="960" y="947" text-anchor="middle"
        font-size="20" font-weight="650" fill="#4C3B61">
    Query–candidate pairs
  </text>
  <text x="960" y="971" text-anchor="middle" font-size="17" fill="#756584">
    Query + candidate text
  </text>

  <path d="M1105 952 H1137" class="runtime"/>

  <rect x="1145" y="920" width="325" height="64" rx="8"
        fill="#735099"/>
  <text x="1307.5" y="947" text-anchor="middle"
        font-size="20" font-weight="700" fill="#FFFFFF">
    Cross-encoder ML model
  </text>
  <text x="1307.5" y="971" text-anchor="middle" font-size="17" fill="#EEE5F7">
    Predict relevance for each pair
  </text>

  <path d="M1474 952 H1506" class="runtime"/>

  <rect x="1514" y="920" width="337" height="64" rx="8"
        fill="#FFFFFF" stroke="#D5CBE3"/>
  <text x="1682.5" y="947" text-anchor="middle"
        font-size="20" font-weight="650" fill="#4C3B61">
    Sort → top_n → enrich
  </text>
  <text x="1682.5" y="971" text-anchor="middle" font-size="17" fill="#756584">
    Ranking driven by model scores
  </text>

  <!-- =========================================================
       FOOTER: LEGEND AND IMPORTANT QUALIFIERS
       ========================================================= -->

  <path d="M49 1045 H83" class="runtime"/>
  <text x="95" y="1051" font-size="16" fill="#617185">Search flow</text>

  <path d="M216 1045 H251" class="data"/>
  <text x="263" y="1051" font-size="16" fill="#617185">Data dependency</text>

  <text x="469" y="1051" font-size="16" fill="#617185">
    Branches indicate dispatch, not guaranteed parallel execution.
  </text>

  <text x="1872" y="1051" text-anchor="end" font-size="16" fill="#617185">
    Similarity % is relevance—not calibrated confidence.
  </text>

</svg>